<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>회원정보 수정</title>
</head>
<body>
    <h1>회원정보 수정</h1>
    <button onclick="location.href='/'">홈으로 돌아가기</button>
    <hr>

    <form id="update-form">
        <h3>기본 정보 수정</h3>
        <p>이름: <input type="text" id="up-name" name="name"></p>
        <p>닉네임: <input type="text" id="up-nickname" name="nickname"></p>
        <p>전화번호: <input type="text" id="up-phone" name="phone"></p>

        <hr>
        <h3>비밀번호 변경</h3>
        <p>새 비밀번호: <input type="password" id="up-password" placeholder="변경할 때만 입력"></p>
        <p>비밀번호 확인: <input type="password" id="up-password-confirm"></p>
        <p id="pw-msg"></p>

        <hr>
        <h3>이메일 변경 및 인증</h3>
        <p>이메일: <input type="email" id="up-email" name="email"> 
           <button type="button" id="send-code-btn">인증번호 받기(Gmail)</button>
        </p>
        <p>인증번호: <input type="text" id="code" placeholder="인증번호 입력">
           <button type="button" id="verify-code-btn">인증 확인</button>
           <span id="verify-status"></span>
        </p>
        <input type="hidden" id="is-email-verified" value="false">

        <hr>
        <button type="submit" id="update-btn" style="padding: 10px 20px; background-color: #4CAF50; color: white; border: none; cursor: pointer;">
            회원정보 수정 완료
        </button>
    </form>

    <script>
        const token = localStorage.getItem('token');
        if (!token) {
            alert("로그인이 필요합니다.");
            location.href = '/';
        }

        let originalEmail = "";

        // 1. 현재 정보 불러오기
        async function loadInfo() {
            const res = await fetch('/auth/me', {
                headers: { Authorization: "Bearer " + token }
            });
            const data = await res.json();

         document.getElementById('up-name').value = data.name;
            document.getElementById('up-nickname').value = data.nickname;
            document.getElementById('up-phone').value = data.phone;
            document.getElementById('up-email').value = data.email;

            originalEmail = data.email;
        }

        // 2. 비밀번호 일치 실시간 확인 로직
        const pw = document.getElementById('up-password');
        const pwConfirm = document.getElementById('up-password-confirm');
        const pwMsg = document.getElementById('pw-msg');

        function validatePassword() {
            if (!pw.value && !pwConfirm.value) {
                pwMsg.textContent = "";
                return;
            }
            if (pw.value === pwConfirm.value) {
                pwMsg.textContent = "✔ 비밀번호가 일치합니다.";
                pwMsg.style.color = "green";
            } else {
                pwMsg.textContent = "✘ 비밀번호가 일치하지 않습니다.";
                pwMsg.style.color = "red";
            }
        }
        pw.addEventListener('input', validatePassword);
        pwConfirm.addEventListener('input', validatePassword);

        /* account.html 내 수정 부분 */
        document.getElementById("send-code-btn").addEventListener("click", async () => {
        const email = document.getElementById("up-email").value;
        if (!email) { alert("이메일을 입력하세요"); return; }
            // 새로 만든 중복체크 겸용 API 호출
            const res = await fetch("/auth/update/send-code", {
            method: "POST",
            headers: { 
                Authorization: "Bearer " + localStorage.getItem('token') 
                },
            body: new URLSearchParams({ email })
        });

        const data = await res.json();
        if (res.ok) alert("인증번호가 전송되었습니다.");
        else alert(data.detail || "전송 실패 (이미 가입된 이메일일 수 있습니다)");
    });

        // 4. 인증번호 확인 (register.html 경로와 일치시킴)
        document.getElementById("verify-code-btn").addEventListener("click", async () => {
            const email = document.getElementById("up-email").value;
            const code = document.getElementById("code").value;
            const verifyStatus = document.getElementById("verify-status");

            if (!code) { alert("인증번호를 입력하세요"); return; }

            const res = await fetch("/auth/verify-code", {
                method: "POST",
                body: new URLSearchParams({ email, code })
            });

            if (!res.ok) {
                verifyStatus.textContent = "잘못된 인증번호 입니다";
                verifyStatus.style.color = "red";
                document.getElementById('is-email-verified').value = "false";
                return;
            }

            verifyStatus.textContent = "✔ 인증 완료";
            verifyStatus.style.color = "green";
            document.getElementById('is-email-verified').value = "true";
        });

        // 5. 최종 수정 요청 제출
        document.getElementById('update-form').onsubmit = async (e) => {
            e.preventDefault();

            // 비밀번호 체크
            if (pw.value && pw.value !== pwConfirm.value) {
                alert("비밀번호 확인이 일치하지 않습니다.");
                return;
            }

            // 이메일 변경 시 인증 여부 체크
            const newEmail = document.getElementById('up-email').value;
            const isVerified = document.getElementById('is-email-verified').value;
            if (newEmail !== originalEmail && isVerified !== "true") {
                alert("이메일을 변경하려면 인증이 필요합니다.");
                return;
            }

            const formData = new URLSearchParams();
            formData.append('name', document.getElementById('up-name').value);
            formData.append('nickname', document.getElementById('up-nickname').value);
            formData.append('phone', document.getElementById('up-phone').value);
            formData.append('email', newEmail);
            if (pw.value) formData.append('password', pw.value);

            const res = await fetch('/auth/update', {
                method: 'PUT',
                headers: { 
                    Authorization: "Bearer " + token,
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: formData
            });

            if (res.ok) {
                alert("정보 수정이 완료되었습니다. 다시 로그인 해주세요.");
                localStorage.removeItem('token'); // 정보 변경 후 재로그인 유도
                location.href = '/';
            } else {
                const err = await res.json();
                alert(err.detail || "수정 실패");
            }
        };

        window.onload = loadInfo;
    </script>
</body>
</html>
